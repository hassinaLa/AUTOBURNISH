
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Login | Auto Burnish</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="admin.css">
    <script src="admin.js" defer></script>
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <a class="brand" href="../index.html">
                AUTO <span>BURNISH</span>
            </a>

            <div class="gold-line"></div>

            <p class="eyebrow">MANAGEMENT PORTAL</p>
            <h1>Welcome Back</h1>
            <p class="subtitle">
                Sign in to manage bookings and customer requests.
            </p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p id="loginMessage" class="message" role="alert" aria-live="polite"></p>

                <button type="submit" id="loginButton">
                    <span>Sign In</span>
                    <span aria-hidden="true">→</span>
                </button>
            </form>

            <p class="footer-note">
                AUTO BURNISH · ADMINISTRATION
            </p>
        </section>
    </main>
</body>
</html>
