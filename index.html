<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Auto Burnish | Detailing Automobile</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>


<body>
<!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="navbar-container">

            <!-- Logo -->
            <a href="#" class="logo">
                AUTO<span>BURNISH</span>
            </a>

            <!-- Desktop Navigation -->
            <nav class="nav-links">

                <a href="#home" class="active">
                    Accueil
                </a>

                <a href="#packages">
                    Packages
                </a>

                <a href="#work">
                    Réalisations
                </a>

                <a href="#about">
                    À propos
                </a>

                <a href="#contact">
                    Contact
                </a>

            </nav>

             <!-- Right Side -->
            <div class="nav-actions">

                <!-- Language -->
                <button class="language-btn">
                    FR
                    <span>⌄</span>
                </button>

                <!-- CTA -->
                <a href="#booking" class="nav-cta">
                    Réserver
                </a>

                <!-- Mobile Menu -->
                <button class="menu-btn" aria-label="Ouvrir le menu">
                    <span></span>
                    <span></span>
                </button>

            </div>

        </div>

    </header>

     <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main>


        <!-- =========================
     HERO
========================== -->

<section id="home" class="hero">

    <!-- Background Image -->
    <div class="hero-image"></div>

    <!-- Dark Overlay -->
    <div class="hero-overlay"></div>


    <!-- Hero Content -->
    <div class="hero-content">

        <div class="hero-label">
            <span class="hero-line"></span>
            AUTO BURNISH
        </div>

        <h1>
            L'art du
            <span>detailing</span>
            automobile.
        </h1>

        <p class="hero-description">
            Sublimez votre véhicule.
            <br>
            Préservez son excellence.
        </p>

        <div class="hero-buttons">

            <a href="#packages" class="gold-button">
                Découvrir nos services
            </a>

            <a href="#contact" class="outline-button">
                Nous contacter
            </a>

        </div>

    </div>


    <!-- Hero Side Information -->
    <div class="hero-side-info">

        <span>DETAILING</span>
        <span>AUTOMOBILE</span>

    </div>


    <!-- Scroll Indicator -->
    <div class="scroll-indicator">

        <span>SCROLL</span>

        <div class="scroll-line"></div>

    </div>


    <!-- Hero Number -->
    <div class="hero-number">
        01
    </div>

</section>

        <!-- Temporary sections -->
        <section id="packages" class="temporary-section">
            <h2>Packages</h2>
        </section>

        <section id="work" class="temporary-section">
            <h2>Réalisations</h2>
        </section>

        <section id="about" class="temporary-section">
            <h2>À propos</h2>
        </section>

        <section id="contact" class="temporary-section">
            <h2>Contact</h2>
        </section>

    </main>

     <!-- JavaScript -->
    <script src="js/script.js"></script>


</body>

</html>
